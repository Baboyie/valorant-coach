<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
    a { color: #3cc8b4; } a:hover { color: #6fdccb; }
    * { box-sizing: border-box; }
    .dc-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .dc-scroll::-webkit-scrollbar-thumb { background: #242a3d; border-radius: 4px; }
    .dc-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</helmet>

<div style="width: 560px; height: 720px; background: #0e1018; color: #e8ecf5; font: 14px/1.5 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; user-select: none;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px 10px; flex: none;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 9px; height: 9px; border-radius: 50%; background: {{stateColor}}; box-shadow: 0 0 8px {{stateColor}};"></div>
      <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.14em;">DEBRIEF</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; color: #8b93a8; font-size: 12px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>
      <span>Valorant</span>
    </div>
  </div>

  <!-- Cockpit: the dial carries state and fill together, so the numbers beside
       it can be smaller without losing the glance-read. -->
  <div style="flex: none; margin: 0 16px 12px; padding: 15px 16px; background: #161a27; border: 1px solid #242a3d; border-radius: 12px; display: flex; align-items: center; gap: 16px;">
    <div style="position: relative; flex: none; width: 74px; height: 74px;">
      <svg width="74" height="74" viewBox="0 0 74 74" style="transform: rotate(-90deg);">
        <circle cx="37" cy="37" r="32" fill="none" stroke="#0b0d15" stroke-width="6"></circle>
        <circle cx="37" cy="37" r="32" fill="none" stroke="{{stateColor}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{dash}}"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1;">{{bufferValue}}</div>
        <div style="font-size: 10px; color: #8b93a8; margin-top: 2px;">{{bufferUnit}}</div>
      </div>
    </div>

    <div style="flex: 1; min-width: 0;">
      <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: {{stateColor}}; margin-bottom: 3px;">{{stateLabel}}</div>
      <div style="font-size: 12px; color: #8b93a8; margin-bottom: 11px;">{{stateCaption}}</div>
      <div style="display: flex; gap: 8px;">
        <button onClick="{{noop}}" style="flex: 1; padding: 9px 12px; background: {{accent}}; color: #06231f; border: 1px solid {{accent}}; border-radius: 8px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;">Save clip</button>
        <button onClick="{{noop}}" style="flex: 1; padding: 9px 12px; background: #1e2436; color: #e8ecf5; border: 1px solid #242a3d; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;">Record</button>
      </div>
    </div>
  </div>

  <!-- The last few clips, always one click away — reviewing what you just
       saved is the most common thing after saving it. -->
  <div style="flex: none; padding: 0 16px 12px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;">
      <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #8b93a8;">Recent</div>
      <div style="font-size: 12px; color: {{accent}}; cursor: pointer;">All 5</div>
    </div>
    <div class="dc-scroll" style="display: flex; gap: 9px; overflow-x: auto; padding-bottom: 4px;">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <div style="flex: none; width: 138px; cursor: pointer;">
          <div style="position: relative; height: 78px; border-radius: 9px; background: {{r.thumb}}; border: 1px solid #242a3d; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#e8ecf5" stroke="none" style="opacity: 0.92;"><path d="M8 5v14l11-7z"></path></svg>
            <div style="position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; background: rgba(5,6,10,0.78); border-radius: 4px; font-size: 10px; font-variant-numeric: tabular-nums;">{{r.dur}}</div>
          </div>
          <div style="font-size: 11.5px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.name}}</div>
          <div style="font-size: 11px; color: #8b93a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.when}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Everything else folds away. One section open at a time keeps the window
       from growing back into the scroll it replaced. -->
  <div class="dc-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px;">

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
      <div style="background: #161a27; border: 1px solid {{s.border}}; border-radius: 11px; overflow: hidden;">
        <div onClick="{{s.toggle}}" style="display: flex; align-items: center; gap: 10px; padding: 12px 15px; cursor: pointer;">
          <div style="color: {{s.iconColor}}; display: flex; flex: none;">
            <sc-if value="{{s.isHealth}}" hint-placeholder-val="{{ true }}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            </sc-if>
            <sc-if value="{{s.isAudio}}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </sc-if>
            <sc-if value="{{s.isCapture}}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; font-size: 13px;">{{s.title}}</div>
          <div style="flex: none; font-size: 11.5px; color: #8b93a8; font-variant-numeric: tabular-nums;">{{s.summary}}</div>
          <div style="flex: none; color: #8b93a8; transform: {{s.chevron}};">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
        </div>

        <sc-if value="{{s.open}}" hint-placeholder-val="{{ true }}">
          <div style="padding: 0 15px 14px;">
            <div style="height: 1px; background: #242a3d; margin-bottom: 12px;"></div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <sc-for list="{{s.rows}}" as="row" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                  <div style="color: #8b93a8; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{row.k}}</div>
                  <div style="flex: none; font-size: 13px; font-variant-numeric: tabular-nums;">{{row.v}}</div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "state": {"editor": "enum", "options": ["idle", "buffering", "recording"], "default": "buffering", "tsType": "string"},
  "accent": {"editor": "color", "default": "#3cc8b4", "options": ["#3cc8b4", "#ff4655", "#7c8cf8", "#f0a742"]},
  "$preview": {"width": 560, "height": 720}
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3cc8b4';
    const REC = '#ff4655';
    const MUTED = '#8b93a8';
    const state = this.props.state ?? 'buffering';
    const open = this.state.open ?? 'health';

    const recording = state === 'recording';
    const buffering = state === 'buffering';
    const stateColor = recording ? REC : buffering ? accent : MUTED;
    const pct = recording ? 1 : buffering ? 0.95 : 0;
    const circumference = 2 * Math.PI * 32;

    const section = (id, title, summary, rows) => ({
      id, title, summary, rows,
      open: open === id,
      border: open === id ? '#2f3854' : '#242a3d',
      iconColor: open === id ? accent : MUTED,
      chevron: open === id ? 'rotate(180deg)' : 'none',
      isHealth: id === 'health',
      isAudio: id === 'audio',
      isCapture: id === 'capture',
      toggle: () => this.setState({ open: open === id ? null : id })
    });

    return {
      accent,
      stateColor,
      stateLabel: recording ? 'recording' : buffering ? 'buffering' : 'idle',
      stateCaption: recording ? 'writing to recordings folder' : buffering ? 'Alt+F10 keeps the last 30s' : 'waiting for Valorant',
      bufferValue: recording ? '2:05' : buffering ? '28.4' : '0.0',
      bufferUnit: recording ? 'elapsed' : 'of 30s',
      dash: (circumference * pct).toFixed(1) + ' ' + circumference.toFixed(1),

      recent: [
        { name: 'clip-065107', when: 'Today 06:51', dur: '0:30', thumb: 'linear-gradient(135deg, #1d2b3a, #2a3f52)' },
        { name: 'clip-065102', when: 'Today 06:51', dur: '0:30', thumb: 'linear-gradient(135deg, #2a2338, #3d2f4f)' },
        { name: 'recording-204846', when: 'Yesterday', dur: '2:05', thumb: 'linear-gradient(135deg, #2b2418, #493c25)' },
        { name: 'clip-123534', when: '15 Aug', dur: '0:30', thumb: 'linear-gradient(135deg, #1f2f2c, #2d4a43)' }
      ],

      sections: [
        section('health', 'Health', '0 dropped', [
          { k: 'CPU', v: '0.51 %' },
          { k: 'RAM', v: '87 MB' },
          { k: 'VRAM', v: '340 MB' },
          { k: 'Disk write', v: '14.2 MB/s' },
          { k: 'Frames kept', v: '102,418' },
          { k: 'Capture callback p99', v: '412 µs' },
          { k: 'Dropped', v: '0' }
        ]),
        section('audio', 'Audio', 'desktop + mic', [
          { k: 'Desktop — Speakers (Realtek)', v: '100%' },
          { k: 'Microphone — HyperX QuadCast S', v: '70%' },
          { k: 'Combine into one track', v: 'off' }
        ]),
        section('capture', 'Capture', '30s · 60fps', [
          { k: 'Record', v: 'Valorant' },
          { k: 'Replay window', v: '30 s' },
          { k: 'Frame rate', v: '60 fps' },
          { k: 'Bitrate', v: 'Auto' },
          { k: 'Save-clip hotkey', v: 'Alt+F10' },
          { k: 'Output folder', v: 'Videos\\DEBRIEF' }
        ])
      ],

      noop: () => {}
    };
  }
}
</script>
</body>
</html>
