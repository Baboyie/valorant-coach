[package]
name = "recorder-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DEBRIEF recorder — tray clipper and manual recording for Valorant"
publish = false

[lib]
name = "recorder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Keep a console attached in release builds. Only for running the autotest,
# whose whole output would otherwise go nowhere.
console = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
recorder-core = { path = "../../recorder-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# One recorder at a time. A second instance is not a harmless duplicate: it
# opens its own capture session and its own encoder against the same game.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine owns COM/MF startup on its own thread and talks to Win32 for
# event-driven game detection (ADR §4).
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Graphics_Dxgi", "Win32_UI_Shell"] }
