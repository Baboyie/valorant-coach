<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DEBRIEF notice</title>
<style>
  /* The window itself is transparent and click-through; only this card paints.
     No margins on the body — the window is sized to the card, and any margin
     here would show as a gap the compositor still treats as ours. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font: 13px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: #e8ecf5;
  }

  #card {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 100%;
    padding: 12px 15px;
    background: rgba(16, 19, 30, 0.93);
    border: 1px solid #2f3854;
    border-left: 3px solid var(--tone, #3cc8b4);
    border-radius: 11px;
    /* Over a bright game the card needs its own separation from the picture;
       a shadow does that without a second border fighting the game's colours. */
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    /* Starts off-screen right and slides in. transform rather than `right`
       so the compositor animates it without laying out every frame. */
    transform: translateX(120%);
    opacity: 0;
    transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1), opacity 200ms ease;
  }
  #card.in { transform: translateX(0); opacity: 1; }

  .icon {
    flex: none;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: color-mix(in srgb, var(--tone, #3cc8b4) 18%, transparent);
    color: var(--tone, #3cc8b4);
  }
  .icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .text { flex: 1; min-width: 0; }
  .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { font-size: 11.5px; color: #8b93a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

  /* Time remaining, so the card's disappearance is expected rather than abrupt. */
  #life {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 6px;
    height: 2px;
    border-radius: 1px;
    background: var(--tone, #3cc8b4);
    opacity: 0.35;
    transform-origin: left center;
  }
</style>
</head>
<body>
  <div id="card">
    <div class="icon" id="icon"></div>
    <div class="text">
      <div class="title" id="title"></div>
      <div class="body" id="body"></div>
    </div>
    <div id="life"></div>
  </div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const TONES = { saved: "#3cc8b4", recording: "#ff4655", failed: "#ff4655", info: "#7c8cf8" };

const ICONS = {
  // Floppy: kept.
  saved: '<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path></svg>',
  recording: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor" stroke="none"></circle></svg>',
  failed: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5"></path><path d="M12 8.5v.01"></path></svg>',
};

const card = document.getElementById("card");
const life = document.getElementById("life");
let timer = null;
let anim = null;

function show(n) {
  const kind = TONES[n.kind] ? n.kind : "info";
  card.style.setProperty("--tone", TONES[kind]);
  document.getElementById("icon").innerHTML = ICONS[kind];
  document.getElementById("title").textContent = n.title;
  document.getElementById("body").textContent = n.body;

  // A second notice while one is up restarts the clock rather than queuing:
  // the newest thing that happened is the one worth reading.
  clearTimeout(timer);
  if (anim) anim.cancel();

  requestAnimationFrame(() => card.classList.add("in"));
  anim = life.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], {
    duration: n.ms,
    easing: "linear",
    fill: "forwards",
  });

  timer = setTimeout(dismiss, n.ms);
}

function dismiss() {
  card.classList.remove("in");
  // Let the slide-out finish before the window goes, or it vanishes mid-flight.
  setTimeout(() => invoke("hide_toast").catch(() => {}), 280);
}

listen("debrief://notice", (e) => show(e.payload));
</script>
</body>
</html>
