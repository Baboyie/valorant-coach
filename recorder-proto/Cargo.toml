[package]
name = "recorder-proto"
version = "0.1.0"
edition = "2021"
description = "Headless capture/encode prototype for the Valorant recorder. Proves overhead before any UI exists."
publish = false

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_System_Threading"] }

[profile.release]
# The prototype is measured, so the release profile is part of the experiment.
# LTO + one codegen unit so we are not benchmarking missed inlining, and real
# panic unwinding kept (abort would change teardown behaviour under test).
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1          # keep symbols so PresentMon/ETW traces are readable
