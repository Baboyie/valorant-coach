[package]
name = "recorder-proto"
version = "0.1.0"
edition = "2021"
description = "Headless CLI over recorder-core: probe/capture/record/replay. The benchmark instrument ADR-001 §5 references."
publish = false

[dependencies]
recorder-core = { path = "../recorder-core" }
# Only what main.rs itself touches: COM/MF startup, window lookup, arg-level HWND.
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
